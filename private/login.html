<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dealer Login — Sai Rudra Motors</title>
  <link rel="stylesheet" href="/css/admin.css">
  <script src="/js/theme.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
</head>
<body class="login-body">
  <div class="login-wrapper">
    <div class="srm-ambient-mesh" aria-hidden="true">
      <div class="ambient-orb orb-blue"></div>
      <div class="ambient-orb orb-indigo"></div>
    </div>

    <div class="login-card">
      <div class="login-header">
        <div class="brand-crest" style="margin: 0 auto 16px auto; display: inline-flex;">
          <span class="crest-monogram">SRM</span>
          <span class="crest-accent"></span>
        </div>
        <h1 class="login-title">Dealer Portal</h1>
        <p class="login-subtitle">Sai Rudra Motors Inventory Management</p>
      </div>

      <form id="loginForm" novalidate>
        <div class="form-group">
          <label for="password">Admin Password</label>
          <div class="password-input-group">
            <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="Enter password" autofocus>
            <button type="button" class="toggle-pwd-btn" id="togglePwd" aria-label="Toggle password visibility">👁️</button>
          </div>
          <div class="field-error" id="passwordError"></div>
        </div>
        <div class="field-error" id="generalError" style="margin-bottom:16px;"></div>
        <button type="submit" class="btn-primary" id="loginBtn" style="width:100%;height:46px;font-size:0.95rem;font-weight:700;">Sign In to Dashboard</button>
      </form>
    </div>

    <a href="/" class="back-to-site">&larr; Return to Customer Catalogue</a>
  </div>

  <script src="/js/admin.js"></script>
  <script>
    const togglePwd = document.getElementById('togglePwd');
    const pwdInput = document.getElementById('password');
    if (togglePwd && pwdInput) {
      togglePwd.addEventListener('click', () => {
        const isPwd = pwdInput.type === 'password';
        pwdInput.type = isPwd ? 'text' : 'password';
        togglePwd.textContent = isPwd ? '🔒' : '👁️';
      });
    }
  </script>
</body>
</html>
